<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · AllureFinds</title>
  <meta name="description" content="Browse custom pens, keychains, diaries, corporate boxes, bottles, mugs, clothing and more from AllureFinds.">
  <meta name="theme-color" content="#16130f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="shop">
<main>
  <section class="page-hero" style="padding-bottom:1.5rem">
    <div class="container">
      <div class="breadcrumbs"><a href="index.html">Home</a>/<a href="shop.html">Shop</a>/<span data-crumb>All gifts</span></div>
      <h1 data-shop-title>The <em class="accent">Collection</em></h1>
      <p class="lead" data-shop-lead></p>
    </div>
  </section>
  <section style="padding-bottom:5rem">
    <div class="container">
      <div class="cat-pills" data-cat-pills aria-label="Categories"></div>
      <div class="shop-toolbar">
        <span class="count" data-shop-count></span>
        <div class="toolbar-right">
          <label class="search-inline"><span class="sr-only">Search</span><input type="search" placeholder="Search this collection" data-shop-q><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label>
          <label><span class="sr-only">Sort</span><select class="select" data-sort><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option></select></label>
        </div>
      </div>
      <div class="product-grid cols-4" data-shop-grid></div>
    </div>
  </section>
  <section class="section-sm" style="padding-top:0">
    <div class="container">
      <div class="cta-banner">
        <img src="https://images.unsplash.com/photo-1764385827344-079d60aa9b8d?auto=format&fit=crop&w=1600&q=80" alt="" loading="lazy">
        <span class="eyebrow" style="color:var(--gold-2)">Can't find it?</span>
        <h2>We make bespoke pieces too</h2>
        <p>Share a reference or an idea — we'll source, brand and deliver it for you.</p>
        <div class="btn-row"><a href="contact.html#quote" class="btn btn-light">Request a custom item</a></div>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
